spring:
  # 数据库配置
  datasource:
    url: jdbc:postgresql://localhost:5432/iragent
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

  # Spring AI OpenAI配置
  ai:
    openai:
      api-key: your-openai-api-key
      base-url: https://api.openai.com/v1

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.suiyuan.iragent.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置
logging:
  level:
    com.suiyuan.iragent: info
    org.springframework: warn

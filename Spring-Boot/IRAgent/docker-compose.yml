# IRAgent Pro 统一中间件部署 (黄金混合开发版)
# 仅保留本地物理安装极其复杂的 Milvus 和 SkyWalking，其余组件已移至本地物理机
# 一键启动：docker compose down && docker compose up -d

services:
  # === Milvus 2.4 (保留在容器内，避免 Windows 物理安装地狱) ===
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - iragent-net

  milvus-minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - milvus-minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - iragent-net

  milvus:
    image: milvusdb/milvus:v2.4.10
    container_name: milvus-standalone
    restart: unless-stopped
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - milvus-data:/var/lib/milvus
    command: milvus run standalone
    depends_on:
      - milvus-etcd
      - milvus-minio
    networks:
      - iragent-net

  # === SkyWalking 9.x (保留在容器内，开箱即用) ===
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: skywalking-oap
    restart: unless-stopped
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      SW_STORAGE: h2
    networks:
      - iragent-net

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: skywalking-ui
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    depends_on:
      - skywalking-oap
    networks:
      - iragent-net

volumes:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:

networks:
  iragent-net:
    driver: bridge
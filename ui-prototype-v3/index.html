<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRAgent v3 — AI 备考助手</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-frame" id="appFrame">

  <!-- Toast -->
  <div class="toast" id="globalToast"></div>

  <!-- Status Bar -->
  <div class="status-bar status-bar--dark" id="statusBar">
    <span class="status-bar__time">9:41</span>
    <span class="status-bar__icons">●●●●○ &nbsp; WiFi</span>
  </div>

  <!-- Dynamic Header (injected per screen) -->
  <div class="app-header" id="appHeader" style="display:none;">
    <button class="app-header__back" data-back="true">←</button>
    <span class="app-header__title" id="headerTitle"></span>
    <span class="app-header__action" id="headerAction"></span>
  </div>

  <!-- Main Content Area -->
  <div class="screen-content" id="screenContent">
    <!-- Screens loaded here by Router -->
    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--color-gray-400);font-size:var(--text-sm);">
      <div class="spinner" style="margin-right:10px;"></div> 加载中...
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <nav class="tab-bar" id="tabBar" style="display:none;">
    <button class="tab-bar__item active" data-tab="knowledge" data-default-screen="knowledge-list">
      <span class="tab-bar__icon">📚</span>
      <span class="tab-bar__label">知识库</span>
    </button>
    <button class="tab-bar__item" data-tab="study" data-default-screen="study-chat">
      <span class="tab-bar__icon">💬</span>
      <span class="tab-bar__label">答疑</span>
    </button>
    <button class="tab-bar__item" data-tab="practice" data-default-screen="practice-hub">
      <span class="tab-bar__icon">✏️</span>
      <span class="tab-bar__label">刷题</span>
    </button>
    <button class="tab-bar__item" data-tab="errors" data-default-screen="errors-list">
      <span class="tab-bar__icon">❌</span>
      <span class="tab-bar__label">错题本</span>
    </button>
    <button class="tab-bar__item" data-tab="profile" data-default-screen="profile-dashboard">
      <span class="tab-bar__icon">👤</span>
      <span class="tab-bar__label">我的</span>
    </button>
  </nav>

</div><!-- /app-frame -->

<script src="js/mock-data.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>

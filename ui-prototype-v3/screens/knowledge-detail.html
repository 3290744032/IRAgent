<!-- 笔记详情: 原文 + 关联考点 + 关联题目 -->
<div style="padding:var(--space-4);">
  <!-- Back button + title -->
  <div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);">
    <button onclick="history.back();App.goBack()" style="width:32px;height:32px;border-radius:50%;background:var(--color-gray-100);border:none;cursor:pointer;font-size:16px;color:var(--color-gray-600);display:flex;align-items:center;justify-content:center;">←</button>
    <span style="font-size:var(--text-lg);font-weight:var(--weight-semibold);color:var(--color-gray-800);">笔记详情</span>
  </div>

  <!-- Note header -->
  <div class="card" style="margin-bottom:var(--space-4);">
    <div class="card__body">
      <div style="display:flex;justify-content:space-between;margin-bottom:var(--space-2);">
        <span style="font-size:var(--text-xs);color:var(--color-primary-500);font-weight:var(--weight-semibold);">📐 数学 · 导数应用</span>
        <span style="font-size:11px;color:var(--color-gray-400);">2026-05-12</span>
      </div>
      <div style="font-size:var(--text-lg);font-weight:var(--weight-bold);color:var(--color-gray-800);margin-bottom:var(--space-3);">闭区间最值 —— 三步法</div>
      <div style="font-size:var(--text-sm);color:var(--color-gray-700);line-height:var(--leading-relaxed);white-space:pre-line;">
求 f(x) 在 [a,b] 上最值：

1. 求导 f'(x)，解 f'(x)=0 找驻点
2. 计算 f(驻点), f(a), f(b)
3. 排序比较，得出最大值和最小值

⚠️ 易错点：忘记计算端点值！
      </div>
      <div style="margin-top:var(--space-3);display:flex;gap:var(--space-2);flex-wrap:wrap;">
        <span class="tag">最值问题</span>
        <span class="tag">驻点</span>
        <span class="tag">端点比较</span>
      </div>
    </div>
  </div>

  <!-- Linked knowledge points -->
  <div style="font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--color-gray-700);margin-bottom:var(--space-3);">📌 关联考点</div>
  <div class="kg-kp-item" style="margin-bottom:var(--space-2);">
    <div class="kg-kp-item__dot" style="background:var(--color-warning);"></div>
    <div class="kg-kp-item__info">
      <div class="kg-kp-item__name">闭区间最值</div>
      <div class="kg-kp-item__meta">导数应用 · 高频考点</div>
    </div>
    <span class="kg-kp-item__mastery kg-kp-item__mastery--medium">65%</span>
  </div>
  <div class="kg-kp-item" style="margin-bottom:var(--space-2);">
    <div class="kg-kp-item__dot" style="background:var(--color-primary-400);"></div>
    <div class="kg-kp-item__info">
      <div class="kg-kp-item__name">单调性与极值</div>
      <div class="kg-kp-item__meta">导数应用 · 高频考点</div>
    </div>
    <span class="kg-kp-item__mastery kg-kp-item__mastery--high">78%</span>
  </div>

  <!-- Linked questions -->
  <div style="font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--color-gray-700);margin:var(--space-4)0 var(--space-3);">🔗 关联题目</div>
  <div class="similar-question-item" onclick="App.navigateTo('errors-detail')">
    <span class="similar-question-item__title">求 f(x)=x³-6x²+9x 在 [0,4] 上的最值</span>
    <span class="badge badge--warning" style="font-size:10px;">曾做错</span>
  </div>
  <div class="similar-question-item">
    <span class="similar-question-item__title">求 f(x)=x³-3x² 在 [-1,3] 上的最值</span>
    <span class="similar-question-item__difficulty">中等</span>
  </div>
</div>

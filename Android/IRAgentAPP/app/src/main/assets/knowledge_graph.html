<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="file:///android_asset/libs/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #FAFBFC; }
        #chart { width: 100%; height: 100%; }
        #waiting {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            color: #9CA3AF; font-size: 14px; text-align: center;
        }
        .legend { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 14px; z-index: 5; }
        .legend-i { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #6B7280; }
        .legend-d { width: 8px; height: 8px; border-radius: 50%; }
    </style>
</head>
<body>
<div id="chart"><div id="waiting">加载知识图谱...</div></div>

<script>
    var chart = null;
    var chartDom = document.getElementById('chart');

    // ===== 节点样式 =====
    function nodeColor(n) {
        switch (n.type) {
            case 'knowledge_point': return (n.mastery||0) >= 0.7 ? '#93C5FD' : '#FCA5A5';
            case 'note': return '#C4B5FD';
            case 'question': return n.status === 'correct' ? '#86EFAC' : '#FCA5A5';
            default: return '#E5E7EB';
        }
    }
    function nodeSize(n) {
        return n.type === 'knowledge_point' ? 18 + (n.value||1)*4 : 16;
    }

    function truncate(s, max) {
        max = max || 6;
        return s && s.length > max ? s.substring(0, max-1) + '…' : s;
    }

    // ===== Android 调用此函数，传入 Base64 编码的 JSON =====
    function renderFromBase64(b64) {
        var json;
        try {
            json = atob(b64);
        } catch(e) {
            document.getElementById('waiting').textContent = '数据解码失败';
            return;
        }

        var data;
        try {
            data = JSON.parse(json);
        } catch(e) {
            document.getElementById('waiting').textContent = 'JSON 解析失败';
            return;
        }

        if (!data || !data.nodes || !data.nodes.length) {
            document.getElementById('waiting').textContent = '暂无图谱数据';
            return;
        }

        // 隐藏等待文案
        var w = document.getElementById('waiting');
        if (w) w.style.display = 'none';

        // 初始化 ECharts（延迟到数据到达后，保证 DOM 尺寸正确）
        if (!chart) {
            chart = echarts.init(chartDom);

            // 点击节点 → Android 导航
            chart.on('click', function(params) {
                if (params.dataType === 'node' && params.data && params.data.rawData) {
                    var d = params.data.rawData;
                    if (window.AndroidInterface && d.actualId) {
                        window.AndroidInterface.onNodeClick(d.type, d.actualId);
                    }
                }
            });

            // 窗口大小变化 → 自适应
            window.addEventListener('resize', function() {
                if (chart) chart.resize();
            });
        }

        // 构建 ECharts 数据
        var nodes = data.nodes.map(function(n) {
            return {
                id: n.id, name: n.name,
                symbolSize: nodeSize(n),
                itemStyle: { color: nodeColor(n), borderColor: '#fff', borderWidth: 1.5 },
                label: { show: n.type === 'knowledge_point',
                    fontSize: 10, color: '#374151', formatter: function(p) { return truncate(p.name); } },
                rawData: n
            };
        });

        var edges = (data.edges || []).map(function(e) {
            return {
                source: e.source, target: e.target,
                lineStyle: { color: '#D1D5DB', width: 1, curveness: 0.2, opacity: 0.7 }
            };
        });

        chart.setOption({
            tooltip: {
                formatter: function(p) {
                    var d = p.data.rawData;
                    if (!d) return p.name;
                    var labels = { knowledge_point: '考点', note: '笔记', question: '题目' };
                    var extra = '';
                    if (d.type === 'knowledge_point')
                        extra = '<br/>掌握度 ' + Math.round((d.mastery||0)*100) + '% · ' + (d.value||0) + ' 条笔记';
                    if (d.type === 'note') extra = '<br/>' + (d.subject || '');
                    if (d.type === 'question') extra = '<br/>' + (d.status === 'correct' ? '✓ 已掌握' : '✗ 待复习');
                    return '<b>' + (labels[d.type]||'') + '</b> ' + d.name + extra;
                }
            },
            animationDuration: 600,
            series: [{
                type: 'graph', layout: 'force', roam: true, draggable: true,
                force: { repulsion: 260, edgeLength: [70, 200], gravity: 0.1 },
                scaleLimit: { min: 0.5, max: 3 },
                data: nodes, edges: edges,
                emphasis: { focus: 'adjacency', lineStyle: { width: 2.5 } }
            }]
        }, true);  // notMerge=true 完全替换数据

        // 强制重绘尺寸
        chart.resize();

        // 通知 Android
        if (window.AndroidInterface) {
            window.AndroidInterface.onRenderComplete();
        }
    }
</script>
</body>
</html>

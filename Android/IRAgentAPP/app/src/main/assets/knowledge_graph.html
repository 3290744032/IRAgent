<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<script src="file:///android_asset/libs/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#F8F9FB;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
#chart{width:100%;height:100%}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:13px;pointer-events:none}
</style>
</head>
<body>
<div id="chart"><div id="msg">加载中...</div></div>

<script>
var chart = null;
var dom = document.getElementById('chart');
var msg = document.getElementById('msg');

function renderFromBase64(b64) {
    try {
        // atob → 字节串 → 每字节%编码 → decodeURIComponent 正确还原UTF-8中文
        var bytes = atob(b64);
        var utf8 = decodeURIComponent(
            bytes.split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join('')
        );
        var data = JSON.parse(utf8);
    } catch(e) { return msg.textContent='数据解析失败'; }
    if (!data || !data.nodes || !data.nodes.length) return msg.textContent='暂无笔记';

    msg.style.display = 'none';

    if (!chart) {
        chart = echarts.init(dom);
        chart.on('click', function(p) {
            if (p.dataType==='node' && p.data && p.data.rawData && window.AndroidInterface) {
                window.AndroidInterface.onNodeClick('note', p.data.rawData.actualId);
            }
        });
        window.addEventListener('resize', function(){ if(chart)chart.resize(); });
    }

    var count = data.nodes.length;
    var size = count < 6 ? 26 : count < 15 ? 22 : 18;

    var n = data.nodes.map(function(x) {
        return {
            id: x.id, name: x.name, symbolSize: size,
            itemStyle: { color: '#C4B5FD', borderColor: '#fff', borderWidth: 1.5 },
            label: { show: true, fontSize: 11, color: '#374151',
                formatter: function(p){ var s=p.name; return s&&s.length>8?s.slice(0,7)+'…':s; } },
            rawData: x
        };
    });

    var e = (data.edges||[]).map(function(x) {
        return {
            source: x.source, target: x.target,
            lineStyle: { color: '#D1D5DB', width: 1, curveness: 0.3, opacity: 0.7 }
        };
    });

    chart.setOption({
        animationDuration: 400,
        tooltip: { formatter: function(p){ return p.name; } },
        series: [{
            type: 'graph', layout: 'force', roam: true, draggable: true,
            force: { repulsion: count<8?200:count*25, edgeLength: [80,200], gravity: 0.12 },
            scaleLimit: { min: 0.5, max: 3 },
            data: n, edges: e,
            emphasis: { focus: 'adjacency', lineStyle: { width: 2, color:'#818CF8' } }
        }]
    }, true);

    chart.resize();
    if (window.AndroidInterface) window.AndroidInterface.onRenderComplete();
}
</script>
</body>
</html>
